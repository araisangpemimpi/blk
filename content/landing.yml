faq:
  title_overline: "Tanya Jawab"
  title: "Masih ragu? Wajar. Ini jawabannya."
  items:
    - q: "Benarkah 100% gratis? Apa jebakannya?"
      a: "Benar gratis. Program ini dibiayai APBN melalui Ditjen Binalavotas Kemnaker RI untuk BLK Komunitas. Tidak ada biaya pendaftaran, alat, atau sertifikat. Peserta justru dapat modul, toolkit, dan uang saku sesuai ketentuan."
    - q: "Siapa saja yang boleh daftar?"
      a: "WNI usia 17–30 tahun, pendidikan min. SMP, diutamakan domisili Mojokerto dan sekitar (Bangsal, Mojosari, Pungging, Kutorejo, Dlanggu). Di luar daerah tetap boleh selama bersedia hadir penuh (tidak disediakan mess, tapi kami bantu info kos santri)."
    - q: "Apakah dapat sertifikat?"
      a: "Ya. Lulus dapat sertifikat pelatihan BLKK Darul Maarif Bangsal Mojokerto + Surat Keterangan. Untuk kejuruan tertentu difasilitasi uji kompetensi mengacu SKKNI/BNSP sesuai kuota."
    - q: "Apakah harus mondok / santri?"
      a: "Tidak wajib. Peserta umum boleh ikut. Yang mondok di Ponpes Darul Maarif justru dapat nilai plus pembinaan karakter, tapi kelas terbuka untuk umum putra & putri (kelas terpisah sesuai ketentuan)."
    - q: "Apakah dijamin dapat kerja?"
      a: "Kami tidak menjanjikan penempatan 100%, tapi kami aktif menyalurkan: info loker mitra, magang, dan pembinaan wirausaha (bantuan rencana usaha + pendampingan). 92% alumni kami terserap kerja/usaha dalam 3 bulan."
    - q: "Kapan gelombang berikutnya dibuka?"
      a: "Gelombang 2/2026 dibuka sekarang dan ditutup saat kuota 16 orang per kelas terpenuhi. Karena peminat membludak (biasanya 100+ pendaftar), amankan kursi via WA sekarang — siapa cepat, dia dapat."

